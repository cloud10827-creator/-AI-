<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>營養門診 BIA & 飲食智能收案系統</title>
  <style>
    :root {
      --primary: #f97316;
      --primary-hover: #ea580c;
      --primary-active: #c2410c;
      --page-bg: #fff7ed;
      --card-bg: #ffffff;
      --card-border: #fed7aa;
      --text-main: #431407;
      --text-sub: #9a3412;
      --text-muted: #7c2d12;
      --success-bg: #fefce8;
      --success-border: #fef08a;
      --success-text: #854d0e;
      --privacy-green: #059669;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #fff7ed 0%, #ffedd5 100%);
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 16px 32px -8px rgba(234, 88, 12, 0.12), 0 4px 12px rgba(0, 0, 0, 0.04);
      border: 1.5px solid var(--card-border);
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: #ffedd5;
      border-radius: 50%;
      font-size: 1.5rem;
      margin-bottom: 8px;
      box-shadow: inset 0 2px 4px rgba(249, 115, 22, 0.15);
    }

    header h1 {
      font-size: 1.35rem;
      margin: 0 0 6px 0;
      color: #9a3412;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    header p {
      margin: 0;
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-sub);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #fdba74;
      border-radius: 12px;
      font-size: 0.95rem;
      background: #ffffff;
      color: #1e293b;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
    }

    .upload-card {
      background: #fffaf5;
      border: 1.5px solid #fed7aa;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .upload-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .upload-card-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #9a3412;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .upload-zone {
      border: 2px dashed #fb923c;
      border-radius: 14px;
      padding: 18px 12px;
      text-align: center;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .upload-zone:hover {
      background: #fff7ed;
      border-color: var(--primary-hover);
    }

    .upload-zone svg {
      width: 38px;
      height: 38px;
      fill: #f97316;
      margin-bottom: 4px;
    }

    .upload-zone p {
      margin: 0;
      font-size: 0.88rem;
      color: #9a3412;
      font-weight: 700;
    }

    .upload-zone span {
      display: block;
      font-size: 0.75rem;
      color: #c2410c;
      margin-top: 3px;
